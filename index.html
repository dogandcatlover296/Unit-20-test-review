
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Classroom</title>
  <link rel="icon" href="https://www.gstatic.com/classroom/logo_square_rounded.svg">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      width: 100%;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background: linear-gradient(135deg, #17133e, #30216b, #1265a8);
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 44px);
    }

    header p {
      margin: 0;
      color: #dedcff;
    }

    #clock {
      text-align: center;
      margin: 14px 0 18px;
      font-size: 15px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .tab {
      padding: 14px 8px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 12px;
      background: rgba(255,255,255,.10);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .tab:hover {
      background: rgba(255,255,255,.20);
    }

    .tab.active {
      background: #7663ef;
      border-color: #b8aaff;
      box-shadow: 0 0 14px rgba(145,125,255,.35);
    }

    .viewer {
      width: 100%;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 16px;
      background: rgba(12,10,35,.8);
      box-shadow: 0 12px 35px rgba(0,0,0,.25);
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      padding: 12px;
      background: rgba(0,0,0,.20);
    }

    #siteName {
      flex: 1 1 150px;
      min-width: 0;
      font-weight: bold;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .toolbar button {
      border: 0;
      border-radius: 8px;
      padding: 10px 13px;
      background: #6654d9;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .toolbar button:hover {
      background: #8574f4;
    }

    .frame-wrap {
      width: 100%;
      height: clamp(400px, 72vh, 1000px);
      min-height: 350px;
      background: white;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .hint {
      padding: 11px 14px;
      color: #dedcff;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    footer {
      padding: 18px 0 4px;
      text-align: center;
      color: #d5d1ff;
      font-size: 12px;
    }

    .viewer:fullscreen {
      width: 100%;
      height: 100%;
      border-radius: 0;
      display: flex;
      flex-direction: column;
      background: #17133e;
    }

    .viewer:fullscreen .frame-wrap {
      flex: 1;
      height: auto;
      min-height: 0;
    }

    .viewer:fullscreen iframe {
      height: 100%;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .tabs {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .tab {
        padding: 12px;
      }

      .toolbar {
        gap: 8px;
      }

      .toolbar button {
        flex: 1 1 auto;
      }

      .frame-wrap {
        height: 70vh;
        height: 70dvh;
        min-height: 350px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>🎮 Arcade Corner</h1>
      <p>Choose a website below</p>
    </header>

    <div id="clock"></div>

    <nav class="tabs" aria-label="Websites">
      <button class="tab active" data-site="duckmath" aria-pressed="true">
        DuckMath
      </button>
      <button class="tab" data-site="totallyScience" aria-pressed="false">
        Totally Science
      </button>
      <button class="tab" data-site="completelyScience" aria-pressed="false">
        Completely Science
      </button>
    </nav>

    <section class="viewer" id="viewer">
      <div class="toolbar">
        <div id="siteName">DuckMath</div>
        <button id="refreshBtn" type="button">↻ Refresh</button>
        <button id="openBtn" type="button">↗ Open Link</button>
        <button id="fullscreenBtn" type="button">⛶ Full Screen</button>
        <button id="exitFullscreenBtn" type="button" hidden>✕ Exit</button>
      </div>

      <div class="frame-wrap">
        <iframe
          id="siteFrame"
          src="https://duckmath.cloud/"
          title="DuckMath"
          allowfullscreen
          loading="eager"
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
      </div>

      <div class="hint">
        If a website does not load inside the frame, try “Open Link.”
        Some websites block being displayed inside another website.
      </div>
    </section>

    <footer>Arcade Corner</footer>
  </main>

  <script>
    const sites = {
      duckmath: {
        name: "DuckMath",
        url: "https://duckmath.cloud/"
      },
      totallyScience: {
        name: "Totally Science",
        url: "https://d11jzht7mj96rr.cloudfront.net/"
      },
      completelyScience: {
        name: "Completely Science",
        url: "https://d1tmbzjih4bfq6.cloudfront.net/classes/all/"
      }
    };

    const frame = document.getElementById("siteFrame");
    const siteName = document.getElementById("siteName");
    const viewer = document.getElementById("viewer");
    const refreshBtn = document.getElementById("refreshBtn");
    const openBtn = document.getElementById("openBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const exitFullscreenBtn = document.getElementById("exitFullscreenBtn");
    const tabs = document.querySelectorAll(".tab");

    let currentSite = "duckmath";

    function loadSite(key) {
      const site = sites[key];
      if (!site) return;

      currentSite = key;
      frame.src = site.url;
      frame.title = site.name;
      siteName.textContent = site.name;

      tabs.forEach(tab => {
        const selected = tab.dataset.site === key;
        tab.classList.toggle("active", selected);
        tab.setAttribute("aria-pressed", String(selected));
      });
    }

    tabs.forEach(tab => {
      tab.addEventListener("click", () => loadSite(tab.dataset.site));
    });

    refreshBtn.addEventListener("click", () => {
      frame.src = sites[currentSite].url;
    });

    openBtn.addEventListener("click", () => {
      window.open(sites[currentSite].url, "_blank", "noopener,noreferrer");
    });

    function updateFullscreenButtons() {
      const isFullscreen = document.fullscreenElement === viewer;
      fullscreenBtn.hidden = isFullscreen;
      exitFullscreenBtn.hidden = !isFullscreen;
    }

    fullscreenBtn.addEventListener("click", async () => {
      try {
        if (viewer.requestFullscreen) {
          await viewer.requestFullscreen();
        } else {
          viewer.classList.add("fullscreen-fallback");
          Object.assign(viewer.style, {
            position: "fixed",
            inset: "0",
            zIndex: "9999",
            width: "100%",
            height: "100%",
            borderRadius: "0",
            display: "flex",
            flexDirection: "column"
          });

          const frameWrap = viewer.querySelector(".frame-wrap");
          Object.assign(frameWrap.style, {
            flex: "1",
            height: "auto",
            minHeight: "0"
          });

          fullscreenBtn.hidden = true;
          exitFullscreenBtn.hidden = false;
        }
      } catch (error) {
        alert("Fullscreen could not be started. Try opening the website in a new tab.");
      }

      updateFullscreenButtons();
    });

    function exitFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }

      if (viewer.classList.contains("fullscreen-fallback")) {
        viewer.classList.remove("fullscreen-fallback");
        viewer.removeAttribute("style");
        viewer.querySelector(".frame-wrap").removeAttribute("style");
      }

      fullscreenBtn.hidden = false;
      exitFullscreenBtn.hidden = true;
    }

    exitFullscreenBtn.addEventListener("click", exitFullscreen);
    document.addEventListener("fullscreenchange", updateFullscreenButtons);

    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent =
        now.toLocaleDateString() + " • " +
        now.toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit"
        });
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
