
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Classroom</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 100'%3E%3Crect width='120' height='100' rx='20' fill='%23fbbc04'/%3E%3Crect x='9' y='9' width='102' height='82' rx='13' fill='%2334a853' stroke='%23fbbc04' stroke-width='5'/%3E%3Ccircle cx='60' cy='34' r='12' fill='white'/%3E%3Cpath d='M35 77 Q35 53 60 53 Q85 53 85 77 Z' fill='white'/%3E%3C/svg%3E">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background: linear-gradient(135deg, #17152f, #302064, #123b70);
    }

    header {
      text-align: center;
      padding: 25px 16px 18px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 42px);
      background: linear-gradient(90deg, #c6a5ff, #69d6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    header p {
      color: #d9d8ff;
      margin: 9px 0 12px;
    }

    #clock {
      color: #bceaff;
      font-size: 14px;
    }

    main {
      max-width: 1250px;
      margin: 0 auto;
      padding: 10px 18px 35px;
    }

    .section-heading {
      margin: 12px 0 17px;
      font-size: 21px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .game-card {
      min-width: 0;
      overflow: hidden;
      border-radius: 15px;
      background: #ffffff;
      color: #17152f;
      box-shadow: 0 8px 22px #00000035;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px #00000050;
    }

    .cover {
      position: relative;
      height: 155px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      isolation: isolate;
    }

    .cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #ffffff35, transparent 48%, #00000030);
      z-index: -1;
    }

    .cover-icon {
      font-size: clamp(54px, 7vw, 86px);
      line-height: 1;
      filter: drop-shadow(0 7px 4px #00000030);
    }

    .cover-label {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 10px;
      font-weight: 900;
      font-size: clamp(13px, 1.5vw, 18px);
      text-shadow: 0 2px 3px #00000060;
      color: white;
      letter-spacing: 0.5px;
    }

    .duckmath {
      background: linear-gradient(135deg, #ffb74d, #ff5d67, #783cff);
    }

    .totally {
      background: linear-gradient(135deg, #7ed957, #218c56, #155d91);
    }

    .completely {
      background: linear-gradient(135deg, #ffd15c, #ff7b3d, #e53d81, #523bce);
    }

    .dogeub {
      background: linear-gradient(135deg, #37f1d0, #3a8dff, #6443d9);
    }

    .elastic {
      background: linear-gradient(135deg, #ff76a9, #a34cff, #3829a6);
    }

    .website-tile {
      display: block;
      width: 100%;
      padding: 13px 8px;
      border: 0;
      border-top: 1px solid #e7e4f5;
      background: white;
      color: #302064;
      text-align: center;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
    }

    .website-tile:hover {
      background: #ece8ff;
      color: #6337d8;
    }

    .website-tile.active {
      color: white;
      background: linear-gradient(90deg, #7448e8, #278ee8);
    }

    .viewer {
      margin-top: 30px;
      border: 1px solid #ffffff30;
      border-radius: 16px;
      overflow: hidden;
      background: #14132b;
      box-shadow: 0 10px 30px #00000035;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      padding: 13px;
      background: #201b43;
    }

    #currentSite {
      flex: 1;
      min-width: 130px;
      font-size: 17px;
      font-weight: bold;
    }

    .toolbar button {
      border: 0;
      border-radius: 8px;
      padding: 10px 13px;
      color: white;
      background: #6346c8;
      font-weight: bold;
      cursor: pointer;
    }

    .toolbar button:hover {
      background: #8068e9;
    }

    .toolbar .open-button {
      background: #147cb8;
    }

    .toolbar .open-button:hover {
      background: #209cdb;
    }

    #gameFrame {
      display: block;
      width: 100%;
      height: 650px;
      border: 0;
      background: white;
    }

    .hint {
      padding: 12px 15px;
      margin: 0;
      color: #c8c4e8;
      font-size: 13px;
      line-height: 1.5;
    }

    .viewer:fullscreen {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      background: #14132b;
    }

    .viewer:fullscreen #gameFrame {
      flex: 1;
      height: auto;
      min-height: 0;
    }

    .viewer:fullscreen .hint {
      display: none;
    }

    @media (max-width: 850px) {
      .gallery {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      #gameFrame {
        height: 560px;
      }
    }

    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .cover {
        height: 125px;
      }

      main {
        padding-left: 12px;
        padding-right: 12px;
      }

      #gameFrame {
        height: 470px;
      }

      .toolbar button {
        padding: 9px 10px;
      }
    }

    @media (max-width: 350px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🎮 Arcade Corner</h1>
    <p>Choose a website below and start playing!</p>
    <div id="clock">Loading clock...</div>
  </header>

  <main>
    <h2 class="section-heading">🎲 Game Websites</h2>

    <section class="gallery" aria-label="Game websites">
      <article class="game-card">
        <div class="cover duckmath">
          <div class="cover-icon">🦆</div>
          <div class="cover-label">DUCKMATH</div>
        </div>
        <button class="website-tile active" data-site="duckmath">
          DuckMath
        </button>
      </article>

      <article class="game-card">
        <div class="cover totally">
          <div class="cover-icon">🌎</div>
          <div class="cover-label">TOTALLY SCIENCE</div>
        </div>
        <button class="website-tile" data-site="totallyScience">
          Totally Science
        </button>
      </article>

      <article class="game-card">
        <div class="cover completely">
          <div class="cover-icon">🚀</div>
          <div class="cover-label">COMPLETELY SCIENCE</div>
        </div>
        <button class="website-tile" data-site="completelyScience">
          Completely Science
        </button>
      </article>

      <article class="game-card">
        <div class="cover dogeub">
          <div class="cover-icon">🎮</div>
          <div class="cover-label">DOGEUB</div>
        </div>
        <button class="website-tile" data-site="dogeub">
          Dogeub
        </button>
      </article>

      <article class="game-card">
        <div class="cover elastic">
          <div class="cover-icon">🤪</div>
          <div class="cover-label">ELASTIC FACE</div>
        </div>
        <button class="website-tile" data-site="elasticFace">
          Elastic Face
        </button>
      </article>
    </section>

    <section class="viewer" id="viewer">
      <div class="toolbar">
        <span id="currentSite">DuckMath</span>
        <button id="refreshButton" type="button">↻ Refresh</button>
        <button id="openButton" class="open-button" type="button">
          ↗ Open Link
        </button>
        <button id="fullscreenButton" type="button">⛶ Full Screen</button>
        <button id="exitFullscreenButton" type="button" hidden>
          ✕ Exit
        </button>
      </div>

      <iframe
        id="gameFrame"
        src="https://duckmath.cloud/"
        title="Selected website"
        allowfullscreen
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>

      <p class="hint">
        If a website does not load here, it may block embedded viewing.
        Use Open Link to try it in a separate tab.
      </p>
    </section>
  </main>

  <script>
    const sites = {
      duckmath: {
        name: "DuckMath",
        url: "https://duckmath.cloud/"
      },
      totallyScience: {
        name: "Totally Science",
        url: "https://d11jzht7mj96rr.cloudfront.net/"
      },
      completelyScience: {
        name: "Completely Science",
        url: "https://d1tmbzjih4bfq6.cloudfront.net/classes/all/"
      },
      dogeub: {
        name: "Dogeub",
        url: "https://d1ks901xvjj2p6.cloudfront.net/index.html#/docs"
      },
      elasticFace: {
        name: "Elastic Face",
        url: "https://d21u3ic0kp9e91.cloudfront.net/elasticman/0/index.html"
      }
    };

    const frame = document.getElementById("gameFrame");
    const currentSite = document.getElementById("currentSite");
    const viewer = document.getElementById("viewer");
    const fullButton = document.getElementById("fullscreenButton");
    const exitButton = document.getElementById("exitFullscreenButton");
    const tileButtons = document.querySelectorAll(".website-tile");

    let activeSite = "duckmath";

    function selectSite(siteKey) {
      const site = sites[siteKey];
      if (!site) return;

      activeSite = siteKey;
      currentSite.textContent = site.name;
      frame.title = site.name;
      frame.src = site.url;

      tileButtons.forEach(button => {
        const selected = button.dataset.site === siteKey;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-pressed", String(selected));
      });
    }

    tileButtons.forEach(button => {
      button.addEventListener("click", () => {
        selectSite(button.dataset.site);
      });
    });

    document.getElementById("refreshButton").addEventListener("click", () => {
      frame.src = sites[activeSite].url;
    });

    document.getElementById("openButton").addEventListener("click", () => {
      window.open(sites[activeSite].url, "_blank", "noopener,noreferrer");
    });

    fullButton.addEventListener("click", async () => {
      try {
        if (viewer.requestFullscreen) {
          await viewer.requestFullscreen();
        } else {
          viewer.classList.add("fallback-fullscreen");
          viewer.style.position = "fixed";
          viewer.style.inset = "0";
          viewer.style.zIndex = "9999";
          viewer.style.width = "100%";
          viewer.style.height = "100%";
          viewer.style.margin = "0";
          viewer.style.borderRadius = "0";
          frame.style.height = "calc(100vh - 65px)";
        }
      } catch (error) {
        alert("Full screen could not start. Try pressing F11 instead.");
      }

      updateFullscreenButtons();
    });

    exitButton.addEventListener("click", async () => {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else {
        resetFallbackFullscreen();
      }
      updateFullscreenButtons();
    });

    function resetFallbackFullscreen() {
      viewer.classList.remove("fallback-fullscreen");
      viewer.style.position = "";
      viewer.style.inset = "";
      viewer.style.zIndex = "";
      viewer.style.width = "";
      viewer.style.height = "";
      viewer.style.margin = "";
      viewer.style.borderRadius = "";
      frame.style.height = "";
    }

    function updateFullscreenButtons() {
      const fallback = viewer.classList.contains("fallback-fullscreen");
      const isFullscreen = Boolean(document.fullscreenElement) || fallback;
      fullButton.hidden = isFullscreen;
      exitButton.hidden = !isFullscreen;
    }

    document.addEventListener("fullscreenchange", updateFullscreenButtons);

    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent =
        now.toLocaleDateString(undefined, {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric"
        }) + " • " +
        now.toLocaleTimeString(undefined, {
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit"
        });
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
